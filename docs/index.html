 ici ?`,r:`Non, je viens de déménager et je n'ai pas encore de dentiste ici.`},{q:`Vous avez mal quelque part ?`,r:`Non.`},{q:`Quand avez-vous été chez le dentiste la dernière fois ?`,r:`L'année passée, en septembre je pense.`},{q:`Qui était votre dentiste précédent ?`,r:`Le nom de votre dentiste habituel.`},{q:`Vous avez droit à l'intervention majorée ?`,r:`Non. → cocher la case, et rappeler le lendemain avec l'autre profil.`},{q:`Quel est votre numéro de registre national ?`,r:`Le donner. → cocher la case, et rappeler le lendemain avec l'autre profil.`},{q:`Le rendez-vous peut-il avoir lieu chez un hygiéniste bucco-dentaire ?`,r:`Non.`}],scenarios:[{id:`A`,titre:`Scénario A — pas de rendez-vous possible`,quand:`Ni cette année, ni l'année prochaine.`,etapes:[{dire:`Puis-je vous demander pourquoi ?`,note:`Raison : plus de nouveaux patients · retraite · autres.`},{dire:`Vous pouvez me conseiller un autre dentiste à proximité ?`,note:`Noter la réponse : même pratique de groupe, ou autre cabinet.`},{dire:`Terminer l'appel.`,note:``}]},{id:`B`,titre:`Scénario B — un rendez-vous est possible`,quand:`Cette année ou l'année prochaine : noter la date, puis parler du prix.`,etapes:[{dire:`J'ai encore une question sur le prix : le dentiste applique les tarifs officiels ou il demande des suppléments ?`,note:``},{dire:`Avec supplément → « Pouvez-vous me dire combien je vais devoir payer, plus ou moins ? »`,note:`Puis : « Serait-il aussi possible d'avoir un rendez-vous au tarif officiel, sans supplément ? »`},{dire:`Sans supplément → confirmer le rendez-vous et terminer l'appel.`,note:`Dans le tableau : rendez-vous sans supplément = oui, même date.`},{dire:`« Je ne sais pas » → « Vous aurez peut-être une idée du prix que je vais devoir payer ? »`,note:`Ensuite : confirmer le rendez-vous et terminer l'appel.`}]},{id:`C`,titre:`Scénario C — pratique de groupe`,quand:`Rien chez le dentiste X cette année, mais le cabinet propose le dentiste Y.`,etapes:[{dire:`Est-ce que je pourrais
